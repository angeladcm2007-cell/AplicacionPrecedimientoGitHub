<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flowers-front</title>
</head>

<body>
  <div id="root">
    <h1>INVENTARIO DE FLORES</h1>
    <!DOCTYPE html>
    <html lang="es">

    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Inventario de Flores</title>
    </head>

    <body>

      <h1>Inventario de Flores</h1>

      <form>
        <label for="nombre">Nombre de la flor:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="cantidad">Cantidad disponible:</label>
        <input type="number" id="cantidad" name="cantidad" min="0" required>
        <br><br>

        <label for="color">Color:</label>
        <input type="text" id="color" name="color" required>
        <br><br>

        <label for="precio">Precio por unidad:</label>
        <input type="number" id="precio" name="precio" min="0" step="0.01" required>
        <br><br>

        <label for="fecha">Fecha de ingreso:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br><br>

        <label for="tipo">Tipo de flor:</label>
        <select id="tipo" name="tipo">
          <option value="rosa">Rosa</option>
          <option value="girasol">Girasol</option>
          <option value="tulipan">Tulipán</option>
          <option value="orquidea">Orquídea</option>
          <option value="clavel">Clavel</option>
          <option value="otra">Otra</option>
        </select>
        <br><br>

        <label for="observaciones">Observaciones:</label>
        <br>
        <textarea id="observaciones" name="observaciones" rows="4" cols="40"></textarea>
        <br><br>

        <button type="submit">Guardar inventario</button>
        <button type="reset">Limpiar</button>
      </form>

    </body>

    </html>

  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
